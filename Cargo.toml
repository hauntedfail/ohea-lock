[package]
name = "ohea-lock"
version = "0.1.0"
authors = ["VVX Club", "VVX Supp", "nonnil"]
edition = "2024"
description = "Rust library for controlling Ohea Lock BLE smart locks"
license = "GPL-3.0"
repository = "https://github.com/v-vx/ohea-lock"
homepage = "https://github.com/v-vx/ohea-lock"
readme = "README.md"
keywords = ["ble", "bluetooth", "smart-lock", "iot", "lixil"]
categories = ["hardware-support", "embedded"]

[lib]
name = "ohea_lock"
path = "src/lib.rs"

[features]
default = []
btleplug-support = ["dep:btleplug"]

[dependencies]
btleplug = { version = "0.11.8", optional = true }
thiserror = "2"
uuid = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"

[[example]]
name = "debug"
required-features = ["btleplug-support"]
